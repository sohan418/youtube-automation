services:
  mysql:
    image: mysql:8.4
    container_name: yt-studio-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: youtube_studio
      MYSQL_USER: youtube
      MYSQL_PASSWORD: youtube
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mysqldata:
